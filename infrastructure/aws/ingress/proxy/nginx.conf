worker_processes 1;
pid /tmp/nginx/nginx.pid;
# Nginx error messages can include request URIs; suppress request-level error logging.
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 15s;
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    # Deliberately omit URI, query, request bodies, credentials, and bearer tokens.
    log_format safe '$remote_addr $request_method $status $request_time';
    access_log /dev/stdout safe;

    # Match the original, unnormalized request target and exact supported methods.
    # Encoded paths, repeated slashes, dot-segments, and unlisted routes fail closed.
    map "$request_method:$request_uri" $public_route {
        default 0;
        "~^POST:/api/auth/(sign-in|password-reset|password-reset/confirm)(\?.*)?$" 1;
        "~^POST:/api/customers(\?.*)?$" 1;
        "~^(GET|HEAD|PUT|DELETE):/api/customers/[0-7][0-9A-HJKMNP-TV-Z]{25}(\?.*)?$" 1;
        "~^POST:/api/customers/[0-7][0-9A-HJKMNP-TV-Z]{25}/(activation|initial-password|activation/resend)(\?.*)?$" 1;
        "~^(GET|HEAD):/api/terms-of-service/[A-Za-z0-9][A-Za-z0-9._-]*(\?.*)?$" 1;
    }

    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
        return 421;
    }
    server {
        listen 443 ssl;
        server_name api.kartoush.dev;
        ssl_certificate /tls/fullchain.pem;
        ssl_certificate_key /tls/private-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        if ($http_host !~* "^api[.]kartoush[.]dev(:443)?$") { return 421; }
        if ($ssl_server_name !~* "^api[.]kartoush[.]dev$") { return 421; }
        if ($public_route = 0) { return 404; }

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host api.kartoush.dev;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host api.kartoush.dev;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
