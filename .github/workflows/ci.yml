name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      application_changes: ${{ steps.filter.outputs.application_changes }}
      container_changes: ${{ steps.filter.outputs.container_changes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Detect application and container changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            application_changes:
              - 'app/**'
              - 'auth/**'
              - 'customer/**'
              - 'notification/**'
              - 'platform/**'
              - 'test-support/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'gradle/**'
              - '!**/*.md'
            container_changes:
              - 'Dockerfile'
              - '.dockerignore'
              - 'compose.container.yaml'
              - '.env.container.example'
              - '.github/workflows/ci.yml'

  container-check:
    needs: changes
    if: ${{ needs.changes.outputs.container_changes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Prepare disposable runtime configuration
        run: |
          python3 - <<'PYTHON'
          import base64, os, secrets
          from pathlib import Path
          values = {
              "KARTOUSH_DB_PASSWORD": secrets.token_urlsafe(24),
              "KARTOUSH_INTERNAL_ADMIN_USERNAME": "container-check-admin",
              "KARTOUSH_INTERNAL_ADMIN_PASSWORD": secrets.token_urlsafe(24),
              "KARTOUSH_JOBS_ACTIVATION_EMAIL_ENCRYPTION_KEY": base64.b64encode(secrets.token_bytes(32)).decode(),
              "KARTOUSH_HTTP_PORT": "18080",
              "SERVER_PORT": "18081",
          }
          path = Path(".env.container")
          path.write_text("".join(f"{key}={value}\n" for key, value in values.items()))
          os.chmod(path, 0o600)
          PYTHON

      - name: Validate configuration and build image
        run: |
          docker compose --env-file .env.container -f compose.container.yaml config --quiet
          docker build -t kartoush-app:local .

      - name: Verify container startup and runtime
        run: |
          docker compose --env-file .env.container -f compose.container.yaml up -d --no-build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:18080/actuator/health
          docker compose --env-file .env.container -f compose.container.yaml exec -T app sh -c 'test "$(id -u)" = 10001 && command -v script && command -v cat'

      - name: Remove disposable stack
        if: ${{ always() }}
        run: |
          if [ -f .env.container ]; then
            docker compose --env-file .env.container -f compose.container.yaml down --volumes
            rm -f .env.container
          fi

  unit-tests:
    needs: changes
    if: ${{ needs.changes.outputs.application_changes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit test suite
        run: ./gradlew --no-daemon test

  integration-tests:
    needs: changes
    if: ${{ needs.changes.outputs.application_changes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-api-integration-tests
            gradle_task: :app:integrationTest
            test_filter: com.kartoush.api.auth.*
          - name: customer-api-integration-tests
            gradle_task: :app:integrationTest
            test_filter: com.kartoush.api.customer.*
          - name: terms-api-integration-tests
            gradle_task: :app:integrationTest
            test_filter: com.kartoush.api.terms.*
          - name: customer-module-integration-tests
            gradle_task: :customer:integrationTest
            test_filter: ''
          - name: auth-module-integration-tests
            gradle_task: :auth:integrationTest
            test_filter: ''

    name: Integration tests (${{ matrix.name }})

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run filtered integration test group
        if: ${{ matrix.test_filter != '' }}
        run: ./gradlew --no-daemon '${{ matrix.gradle_task }}' --tests '${{ matrix.test_filter }}'

      - name: Run module integration test group
        if: ${{ matrix.test_filter == '' }}
        run: ./gradlew --no-daemon '${{ matrix.gradle_task }}'

  verify:
    runs-on: ubuntu-latest
    needs:
      - changes
      - unit-tests
      - integration-tests
      - container-check
    if: ${{ always() }}

    steps:
      - name: Validate upstream job results
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection did not succeed."
            echo "changes=${{ needs.changes.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.container_changes }}" = "true" ]; then
            if [ "${{ needs.container-check.result }}" != "success" ]; then
              echo "Container verification did not succeed."
              exit 1
            fi
          elif [ "${{ needs.changes.outputs.container_changes }}" = "false" ]; then
            if [ "${{ needs.container-check.result }}" != "skipped" ]; then
              echo "Container verification was not intentionally skipped."
              exit 1
            fi
          else
            echo "Container change detection returned an unexpected result."
            exit 1
          fi

          if [ "${{ needs.changes.outputs.application_changes }}" = "false" ]; then
            if [ "${{ needs.unit-tests.result }}" != "skipped" ] || [ "${{ needs.integration-tests.result }}" != "skipped" ]; then
              echo "One or more application test jobs were not intentionally skipped."
              echo "unit-tests=${{ needs.unit-tests.result }}"
              echo "integration-tests=${{ needs.integration-tests.result }}"
              exit 1
            fi

            echo "No application or Gradle changes; application test jobs were intentionally skipped."
            exit 0
          fi

          if [ "${{ needs.changes.outputs.application_changes }}" != "true" ]; then
            echo "Change detection returned an unexpected result."
            echo "application_changes=${{ needs.changes.outputs.application_changes }}"
            exit 1
          fi

          if [ "${{ needs.unit-tests.result }}" != "success" ] || [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "One or more verification jobs failed."
            echo "unit-tests=${{ needs.unit-tests.result }}"
            echo "integration-tests=${{ needs.integration-tests.result }}"
            exit 1
          fi
